<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paiement — Tableau Staff</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="shop-header">
    <div class="shop-logo">SCRIPT<span class="dot">.</span>SHOP</div>
    <a href="tableau-staff.html" class="back-link">← Retour au script</a>
  </header>

  <main class="pay-wrap">

    <a href="tableau-staff.html" class="pay-back">← Annuler</a>

    <h1>Finaliser l'achat</h1>

    <div class="pay-summary">
      <div class="item-name">
        Tableau Staff
        <span>Achat unique — livraison par Discord</span>
      </div>
      <div class="item-price">3 €</div>
    </div>

    <!--
      IMPORTANT : ce bouton doit être remplacé par le vrai bouton PayPal
      généré depuis ton compte PayPal Business (paypal.com/buttons).
      PayPal gère lui-même le paiement par carte bancaire pour les
      acheteurs qui n'ont pas de compte PayPal — pas besoin de créer
      un formulaire de carte toi-même.
    -->
    <button class="pay-method-btn paypal" id="paypalBtn" type="button">
      Payer avec PayPal
    </button>

    <!--
      IMPORTANT : ce bouton doit être remplacé par ton vrai lien Stripe
      Payment Link, créé gratuitement depuis ton compte Stripe
      (dashboard.stripe.com > Payment links > Créer un lien de paiement).
      Stripe gère lui-même la sécurité des données de carte bancaire —
      ne jamais créer un formulaire carte toi-même.
    -->
    <button class="pay-method-btn card" id="cardBtn" type="button">
      Payer par carte
    </button>

    <p class="pay-secure-note">
      En cliquant, tu es redirigé vers un espace de paiement sécurisé
      (PayPal ou Stripe) pour finaliser ton achat.
    </p>

  </main>

  <script>
    // Remplace cette redirection par ton vrai lien de bouton PayPal
    // (généré dans ton compte PayPal Business > Outils de vente > Boutons de paiement).
    document.getElementById('paypalBtn').addEventListener('click', () => {
      window.location.href = "https://paypal.me/NZshopscriptfivem/3";
    });

    // Remplace cette redirection par ton vrai lien de paiement Stripe
    // (créé dans ton dashboard Stripe > Payment links).
    document.getElementById('cardBtn').addEventListener('click', () => {
      alert('Remplace ce bouton par ton vrai lien Stripe Payment Link avant la mise en ligne.');
      // window.location.href = "TON_LIEN_STRIPE_ICI";
    });
  </script>

</body>
</html>
