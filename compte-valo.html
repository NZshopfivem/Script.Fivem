<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compte Valorant — Scripts FiveM</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="shop-header">
    <div class="shop-logo">SCRIPT<span class="dot">.</span>SHOP</div>
    <a href="boutique.html" class="back-link">← Retour à la boutique</a>
  </header>

  <main class="detail-wrap">

    <!-- La photo s'affiche automatiquement dès que tu uploades un fichier nommé exactement compte-valo-screenshot.jpg dans le repo -->
    <div class="detail-photo">
      <img src="compte-valo-screenshot.jpg" alt="Aperçu de Compte Valorant" onerror="this.style.display='none'; this.parentElement.querySelector('.photo-placeholder-text').style.display='flex';" />
      <span class="photo-placeholder-text">Photo à venir — uploade compte-valo-screenshot.jpg dans le repo</span>
    </div>

    <span class="detail-tag">Standalone</span>
    <h1>Compte Valorant</h1>
    <p class="detail-desc">
  
    </p>

    <div class="pricing-tiers">

      <div class="tier-card">
        <div class="tier-label">Compte Valorant 1</div>
        <div class="tier-price">80 €</div>
        <a href="paiement-valo-1.html" class="tier-btn">Acheter</a>
      </div>

      <div class="tier-card">
        <div class="tier-label">Compte Valorant 2</div>
        <div class="tier-price">Prix à venir</div>
        <a href="paiement-valo-2.html" class="tier-btn">Acheter</a>
      </div>

      <div class="tier-card">
        <div class="tier-label">Compte Valorant 3</div>
        <div class="tier-price">Prix à venir</div>
        <a href="paiement-valo-3.html" class="tier-btn">Acheter</a>
      </div>

    </div>

  </main>

</body>
</html>
