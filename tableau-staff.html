<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nitro — Scripts FiveM</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="shop-header">
    <div class="shop-logo">SCRIPT<span class="dot">.</span>SHOP</div>
    <a href="boutique.html" class="back-link">← Retour à la boutique</a>
  </header>

  <main class="detail-wrap">

    <!-- La photo s'affiche automatiquement dès que tu uploades un fichier nommé exactement tableau-screenshot.jpg dans le repo -->
    <div class="detail-photo">
      <img src="tableau-screenshot.jpg" alt="Aperçu du tableau staff" onerror="this.style.display='none'; this.parentElement.querySelector('.photo-placeholder-text').style.display='flex';" />
      <span class="photo-placeholder-text">Photo à venir — uploade tableau-screenshot.jpg dans le repo</span>
    </div>

    <span class="detail-tag">Application externe</span>
    <h1>Nitro</h1>
    <p class="detail-desc">
      Ceci est du Nitro. Si vous en voulez pour plus de 3 mois, faites un ticket Discord.
    </p>

    <div class="pricing-tiers">
      <div class="tier-card">
        <div class="tier-label">1 mois</div>
        <div class="tier-price">4,50 €</div>
        <a href="paiement-1mois.html" class="tier-btn">Acheter</a>
      </div>
      <div class="tier-card">
        <div class="tier-label">2 mois</div>
        <div class="tier-price">9 €</div>
        <a href="paiement-2mois.html" class="tier-btn">Acheter</a>
      </div>
      <div class="tier-card">
        <div class="tier-label">3 mois</div>
        <div class="tier-price">13,50 €</div>
        <a href="paiement-3mois.html" class="tier-btn">Acheter</a>
      </div>
    </div>

  </main>

</body>
</html>
