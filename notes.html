<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bloc-notes — Scripts FiveM</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .notes-wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 44px 24px 100px;
    }

    .notes-wrap h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
    }

    .notes-sub {
      color: var(--text-dim);
      font-size: 0.85rem;
      margin-bottom: 24px;
    }

    .notes-area {
      width: 100%;
      min-height: 60vh;
      background: var(--bg-soft);
      border: 1px solid var(--green-dim);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.7;
      padding: 20px;
      resize: vertical;
    }

    .notes-area:focus {
      outline: none;
      border-color: var(--green);
    }

    .notes-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .notes-status {
      font-size: 0.75rem;
      color: var(--green-dim);
    }

    .notes-status.saved {
      color: var(--green);
    }

    .notes-clear-btn {
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #ff6b6b;
      background: transparent;
      border: 1px solid #7a2a2a;
      border-radius: 4px;
      padding: 9px 16px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .notes-clear-btn:hover {
      background: #ff6b6b;
      color: #1a0505;
      border-color: #ff6b6b;
    }
  </style>
</head>
<body>

  <header class="shop-header">
    <div class="shop-logo">SCRIPT<span class="dot">.</span>SHOP</div>
    <a href="boutique.html" class="back-link">← Retour à la boutique</a>
  </header>

  <main class="notes-wrap">
    <h1>Bloc-notes</h1>
    <p class="notes-sub">Écris ce que tu veux ici — tout est sauvegardé automatiquement sur cet appareil, même si tu fermes la page.</p>

    <textarea class="notes-area" id="notesArea" placeholder="Écris librement ici..."></textarea>

    <div class="notes-footer">
      <span class="notes-status" id="statusText">Prêt</span>
      <button class="notes-clear-btn" id="clearBtn" type="button">Tout effacer</button>
    </div>
  </main>

  <script>
    const area = document.getElementById('notesArea');
    const status = document.getElementById('statusText');
    const clearBtn = document.getElementById('clearBtn');
    const STORAGE_KEY = 'scriptshop_notes';

    // Charge le texte sauvegardé au chargement de la page
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      area.value = saved;
      status.textContent = 'Chargé';
    }

    let saveTimeout;
    area.addEventListener('input', () => {
      status.textContent = 'Écriture...';
      status.classList.remove('saved');
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(() => {
        localStorage.setItem(STORAGE_KEY, area.value);
        status.textContent = 'Sauvegardé ✓';
        status.classList.add('saved');
      }, 500);
    });

    clearBtn.addEventListener('click', () => {
      if (confirm('Effacer tout le texte ? Cette action est irréversible.')) {
        area.value = '';
        localStorage.removeItem(STORAGE_KEY);
        status.textContent = 'Effacé';
        status.classList.remove('saved');
      }
    });
  </script>

</body>
</html>
