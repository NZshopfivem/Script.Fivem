<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paiement — Compte Brawl Stars</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="shop-header">
    <div class="shop-logo">SCRIPT<span class="dot">.</span>SHOP</div>
    <a href="compte-brawl.html" class="back-link">← Retour au script</a>
  </header>

  <main class="pay-wrap">

    <a href="compte-brawl.html" class="pay-back">← Annuler</a>

    <h1>Finaliser l'achat</h1>

    <!-- La photo s'affiche automatiquement dès que tu uploades un fichier nommé exactement brawl-photo.jpg dans le repo -->
    <div class="pay-photo" onclick="document.getElementById('lightboxImg').src=this.querySelector('img').src; document.getElementById('lightbox').classList.add('show');">
      <img src="brawl-photo.jpg" alt="Aperçu Compte Brawl Stars" onerror="this.style.display='none'; this.parentElement.querySelector('.pay-photo-placeholder-text').style.display='flex';" />
      <span class="pay-photo-placeholder-text">Photo à venir — uploade brawl-photo.jpg dans le repo</span>
    </div>

    <div class="pay-summary">
      <div class="item-name">
        Compte Brawl Stars
        <span>Livraison par Discord après achat</span>
      </div>
      <div class="item-price">150 €</div>
    </div>

    <a href="https://paypal.me/NZshopscriptfivem/150" class="pay-method-btn paypal" style="display:block; box-sizing:border-box; text-align:center;">
      Payer avec PayPal
    </a>

    <p class="pay-secure-note">
      En cliquant, tu es redirigé vers PayPal pour finaliser ton achat.
    </p>

  </main>

  <div class="lightbox-overlay" id="lightbox" onclick="this.classList.remove('show')">
    <img id="lightboxImg" src="" alt="Aperçu agrandi" />
  </div>

</body>
</html>
