<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paiement — Compte Valorant 3</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="shop-header">
    <div class="shop-logo">SCRIPT<span class="dot">.</span>SHOP</div>
    <a href="compte-valo.html" class="back-link">← Retour au script</a>
  </header>

  <main class="pay-wrap">

    <a href="compte-valo.html" class="pay-back">← Annuler</a>

    <h1>Finaliser l'achat</h1>

    <div class="pay-summary">
      <div class="item-name">
        Compte Valorant 3
        <span>Livraison par Discord après achat</span>
      </div>
      <!-- Remplace XX par le vrai prix une fois défini -->
      <div class="item-price">XX €</div>
    </div>

    <button class="pay-method-btn paypal" id="paypalBtn" type="button">
      Payer avec PayPal
    </button>

    <!-- Remplace ce lien par ton vrai lien de paiement Stripe pour Compte Valorant 3 -->
    <a href="#" class="pay-method-btn card">
      Payer par carte
    </a>

    <p class="pay-secure-note">
      En cliquant, tu es redirigé vers un espace de paiement sécurisé (PayPal ou Stripe) pour finaliser ton achat.
    </p>

  </main>

  <script>
    // Remplace ce lien par ton vrai lien PayPal Business (bouton dédié ou paypal.me) pour Compte Valorant 3.
    // N'oublie pas de remplacer le montant une fois le prix défini.
    document.getElementById('paypalBtn').addEventListener('click', () => {
      window.location.href = "https://paypal.me/NZshopscriptfivem";
    });
  </script>

</body>
</html>
